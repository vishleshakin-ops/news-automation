<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vishleshak — Daily Market Briefs</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1a202c 100%);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: slideIn 0.6s ease-out;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 1.1rem;
            color: #94a3b8;
        }

        .status {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 16px;
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid #22c55e;
            border-radius: 20px;
            font-size: 0.9rem;
            color: #22c55e;
            font-weight: 500;
        }

        .status::before {
            content: "●";
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            animation: slideIn 0.6s ease-out 0.1s both;
        }

        .date-picker {
            padding: 12px 18px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.3);
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .date-picker:hover {
            border-color: #60a5fa;
            background: rgba(30, 41, 59, 1);
        }

        .btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Cards */
        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 12px;
            padding: 24px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            animation: slideIn 0.6s ease-out 0.2s both;
        }

        .card:hover {
            border-color: rgba(96, 165, 250, 0.5);
            background: rgba(30, 41, 59, 1);
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.2);
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #60a5fa;
        }

        .card-time {
            font-size: 0.85rem;
            color: #94a3b8;
            background: rgba(96, 165, 250, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
        }

        .card-content {
            font-size: 1rem;
            line-height: 1.6;
            color: #cbd5e1;
            white-space: pre-wrap;
        }

        .card-section {
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
        }

        .card-section:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .section-label {
            font-size: 0.9rem;
            color: #64748b;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .section-text {
            color: #e2e8f0;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        /* Indices */
        .indices {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(148, 163, 184, 0.2);
        }

        .index {
            background: rgba(96, 165, 250, 0.1);
            padding: 12px;
            border-radius: 8px;
            border-left: 3px solid #60a5fa;
        }

        .index-symbol {
            font-size: 0.9rem;
            color: #94a3b8;
            font-weight: 600;
        }

        .index-price {
            font-size: 1.2rem;
            color: #60a5fa;
            font-weight: 700;
            margin: 4px 0;
        }

        .index-change {
            font-size: 0.85rem;
            font-weight: 600;
        }

        .index-change.positive {
            color: #22c55e;
        }

        .index-change.negative {
            color: #ef4444;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.1rem;
            color: #94a3b8;
        }

        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid rgba(96, 165, 250, 0.2);
            border-top: 3px solid #60a5fa;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Error */
        .error {
            text-align: center;
            padding: 30px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 12px;
            color: #fca5a5;
            margin: 20px 0;
        }

        /* Empty State */
        .empty {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .empty-text {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 10px;
        }

        .empty-subtext {
            color: #64748b;
            font-size: 1rem;
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 60px;
            padding-top: 20px;
            border-top: 1px solid rgba(148, 163, 184, 0.2);
            color: #64748b;
            font-size: 0.9rem;
        }

        /* Animations */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .cards-container {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
            }

            .date-picker, .btn {
                width: 100%;
            }

            .indices {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Daily Market Briefs</h1>
            <p>AI-powered insights from Vishleshak</p>
            <div class="status">Live & Updated</div>
        </div>

        <div class="controls">
            <input type="date" id="datePicker" class="date-picker">
            <button class="btn" onclick="fetchTodayBrief()">Today's Brief</button>
            <button class="btn" onclick="refreshDashboard()">Refresh</button>
        </div>

        <div id="briefsContainer" class="cards-container">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading briefs...</p>
            </div>
        </div>

        <div class="footer">
            <p>© 2026 Vishleshak — Financial News Automation</p>
            <p>Data powered by Alpha Vantage | Analysis by Claude AI</p>
        </div>
    </div>

    <script>
        const API_BASE = "http://localhost:8000";

        // Initialize date picker with today's date
        function initDatePicker() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('datePicker').value = today;
            document.getElementById('datePicker').max = today;
        }

        // Fetch briefs for selected date
        async function fetchBriefs(date) {
            const container = document.getElementById('briefsContainer');
            container.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading briefs...</p></div>';

            try {
                const response = await fetch(`${API_BASE}/brief/${date}`);
                if (!response.ok) throw new Error('No briefs found');

                const data = await response.json();
                renderBriefs(data.briefs);
            } catch (error) {
                container.innerHTML = `<div class="error">⚠️ ${error.message}</div>`;
            }
        }

        // Render briefs on page
        function renderBriefs(briefs) {
            const container = document.getElementById('briefsContainer');

            if (!briefs || briefs.length === 0) {
                container.innerHTML = `
                    <div style="grid-column: 1/-1;">
                        <div class="empty">
                            <div class="empty-icon">📭</div>
                            <div class="empty-text">No briefs available</div>
                            <div class="empty-subtext">Try selecting a different date</div>
                        </div>
                    </div>
                `;
                return;
            }

            container.innerHTML = briefs.map((brief, idx) => `
                <div class="card" style="animation-delay: ${idx * 0.1}s">
                    <div class="card-header">
                        <div class="card-title">${getTimeSlotEmoji(brief.time_slot)} ${brief.title}</div>
                        <div class="card-time">${brief.time_slot.toUpperCase()}</div>
                    </div>

                    <div class="card-content">
                        ${formatBriefContent(brief.content)}
                    </div>

                    ${brief.indices ? `
                        <div class="indices">
                            ${renderIndices(brief.indices)}
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        // Format brief content into sections
        function formatBriefContent(content) {
            const sections = content.split('\n\n');
            return sections
                .filter(s => s.trim())
                .map((section, idx) => {
                    const labels = ['📈 Market Overview', '📰 Headlines', '🏢 Sector Analysis', '💡 Investor Takeaway'];
                    const label = labels[idx] || `Section ${idx + 1}`;
                    const text = section.replace(/^\*\*.*?\*\*/, '').trim();

                    return `
                        <div class="card-section">
                            <div class="section-label">${label}</div>
                            <div class="section-text">${text}</div>
                        </div>
                    `;
                }).join('');
        }

        // Render indices (Sensex, Nifty)
        function renderIndices(indices) {
            const indexList = [indices.sensex, indices.nifty].filter(Boolean);
            return indexList.map(idx => {
                const change = parseFloat(idx.change_percent);
                const isPositive = change > 0;

                return `
                    <div class="index">
                        <div class="index-symbol">${idx.symbol}</div>
                        <div class="index-price">${idx.price}</div>
                        <div class="index-change ${isPositive ? 'positive' : 'negative'}">
                            ${isPositive ? '▲' : '▼'} ${idx.change_percent}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Get emoji for time slot
        function getTimeSlotEmoji(timeSlot) {
            const emojis = { morning: '🌅', closing: '🌆', afternoon: '☀️', evening: '🌙' };
            return emojis[timeSlot] || '📊';
        }

        // Fetch today's brief
        function fetchTodayBrief() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('datePicker').value = today;
            fetchBriefs(today);
        }

        // Refresh dashboard
        function refreshDashboard() {
            const selectedDate = document.getElementById('datePicker').value;
            fetchBriefs(selectedDate);
        }

        // Event listeners
        document.getElementById('datePicker').addEventListener('change', (e) => {
            fetchBriefs(e.target.value);
        });

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', () => {
            initDatePicker();
            fetchTodayBrief();
        });
    </script>
</body>
</html>
